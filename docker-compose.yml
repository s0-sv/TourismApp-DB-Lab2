services:
  postgres:
    image: postgres:17
    container_name: tourism-lab2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tourism
    ports:
      - "5433:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8.0
    container_name: tourism-lab2-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.4
    container_name: tourism-lab2-redis
    ports:
      - "6380:6379"

volumes:
  pg_data:
  mongo_data:
